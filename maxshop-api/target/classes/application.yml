server:
  port: ${PORT:8080}

spring:
  application:
    name: maxshop-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/maxshop}
    username: ${DATABASE_USERNAME:maxshop}
    password: ${DATABASE_PASSWORD:maxshop}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:troque-esta-chave-em-producao-min-32-caracteres-1234567890}
  access-token-expiration-ms: ${JWT_ACCESS_EXP:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP:2592000000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.maxshop.api: INFO
    org.springframework.security: WARN

