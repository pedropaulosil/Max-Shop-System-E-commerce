services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maxshop
      POSTGRES_USER: maxshop
      POSTGRES_PASSWORD: maxshop
    ports:
      - "5432:5432"
    volumes:
      - maxshop_pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/maxshop
      DATABASE_USERNAME: maxshop
      DATABASE_PASSWORD: maxshop
      JWT_SECRET: dev-secret-nao-usar-em-producao-min-32-chars
      CORS_ALLOWED_ORIGINS: http://localhost:3000

volumes:
  maxshop_pgdata:
